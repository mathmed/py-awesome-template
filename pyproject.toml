[project]
name = "py-awesome-template"
description = ""
authors = []
version = "1.0.0"
requires-python = ">=3.14"
# Change project dependencies here
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
"Homepage" = "https://github.com/mathmed/py-awesome-template"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "faker>=40.39.0",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.9",
    "vulture>=2.16",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["app"]
relative_files = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.vulture]
min_confidence = 80
paths = ["app"]

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"
