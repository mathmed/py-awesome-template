# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 100
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
      semver-major-days: 15
      semver-minor-days: 10
      semver-patch-days: 5
    groups:
      python-non-breaking:
        update-types:
          - "minor"
          - "patch"
      python-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 50
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
    groups:
      actions-non-breaking:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
