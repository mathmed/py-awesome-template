name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    # Here you can specify which branches you want to run the workflow
    branches: ["main"]

permissions:
  contents: read

# Every analysis job runs its tool through scripts/quality_report.py, which keeps the tool's exit code
# (the job is still the gate) and stores the output as a fragment artifact (quality-fragment-<job>).
# The quality-report job at the end assembles the fragments into the single PR comment.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff check)
        run: uv run --locked python scripts/quality_report.py run ruff-check -- ruff check .
      - name: Format (ruff format --check)
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run ruff-format -- ruff format --check .

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-lint
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Type check (mypy)
        run: uv run --locked python scripts/quality_report.py run mypy -- mypy app tests

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-types
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Security scan (bandit)
        run: uv run --locked python scripts/quality_report.py run bandit -- bandit -r app -ll
      - name: Dependency vulnerability scan (pip-audit)
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run pip-audit -- pip-audit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-security
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Dead code check (vulture, advisory)
        run: uv run --locked python scripts/quality_report.py run vulture --advisory -- vulture app --min-confidence 80

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-dead-code
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Complexity check (xenon)
        run: uv run --locked python scripts/quality_report.py run xenon -- xenon app --max-absolute B --max-modules A --max-average A

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-complexity
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  lint-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Architecture contracts (import-linter)
        run: uv run --locked python scripts/quality_report.py run import-linter -- lint-imports

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-lint-imports
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7


  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add your dependencies (Postgres...) as service containers and point the app at them through
    # the env file, or set SMOKE_COMPOSE_FILE (see scripts/smoke.sh and the README):
    # services:
    #   postgres:
    #     image: postgres:17
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Boot smoke (health + ready)
        run: uv run --locked --no-dev python scripts/quality_report.py run smoke -- ./scripts/smoke.sh

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-smoke
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  tests:
    runs-on: ubuntu-latest
    permissions:
      # write: on push to main, the coverage action publishes the README badge to the
      # python-coverage-comment-action-data branch
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Tests + Coverage
        run: uv run --locked python scripts/quality_report.py run pytest -- uv run --locked pytest --cov --cov-report=xml --cov-report=term

      # Only updates the coverage badge on push to main. On PRs the coverage is part of the Quality Report.
      - name: Coverage badge
        if: github.event_name == 'push'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-tests
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Mutation testing lives in its own workflow (also run weekly and on demand); on PRs it is called
  # from here so that its result is part of this run and of the Quality Report.
  mutation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/mutation.yml

  quality-report:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, types, security, dead-code, complexity, lint-imports, smoke, tests, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Minimum needed to upsert the PR comment. Read-only on fork PRs: the comment step then warns
      # instead of failing, and the report is still in the job summary.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: quality-fragment-*
          merge-multiple: true
          path: quality-fragments

      - name: Build report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_REPORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-project python scripts/quality_report.py render \
            --needs-json "$NEEDS_JSON" --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('quality-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number,
              });
              const existing = comments.find(c => c.body.includes('<!-- quality-report -->'));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } catch (error) {
              core.warning(`Could not post the Quality Report comment (read-only token on fork PRs?): ${error.message}. The report is in the job summary.`);
            }
